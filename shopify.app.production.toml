# Semafor — Shopify app configuration (Dev Dashboard app 432372121601)
client_id = "ff9a2bc78999c0b605d1fd3a38678477"
name = "Semafor"
handle = "semafor"
application_url = "https://semafor-production.up.railway.app"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders/create"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[access_scopes]
scopes = "read_orders,write_orders,read_customers,write_customers,write_pixels,read_customer_events"

[auth]
redirect_urls = [ "https://semafor-production.up.railway.app/auth/callback", "https://semafor-production.up.railway.app/auth/shopify/callback", "https://semafor-production.up.railway.app/api/auth/callback" ]

[pos]
embedded = false
