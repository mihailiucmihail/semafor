query RunInput {
  shop { metafield(namespace: "semafor", key: "blocklist") { value } }
  localization { country { isoCode } }
  buyerIdentity { email phone }
  cart {
    attribute(key: "_dev") { value }
    deliveryGroups {
      deliveryAddress { address1 address2 city zip phone countryCode }
    }
  }
}
