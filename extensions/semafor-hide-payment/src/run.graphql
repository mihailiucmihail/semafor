query CartPaymentMethodsTransformRunInput {
  paymentMethods { id name }
  localization { country { isoCode } }
  cart {
    buyerIdentity { email phone }
    deliveryGroups { deliveryAddress { firstName lastName address1 address2 city phone } }
    attribute(key: "_dev") { value }
  }
  paymentCustomization { metafield(namespace: "$app", key: "blocklist") { jsonValue } }
}
